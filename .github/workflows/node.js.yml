name: Node.js CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Lint Frontend
        run: npm run lint
      - name: Test Frontend
        run: npx vitest run --passWithNoTests
      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    environment:
      name: .env

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: ./backend

    env:
      PORT: ${{ vars.PORT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: npm ci
      - name: Start MongoDB for Ubuntu smoke test
        if: runner.os == 'Linux'
        run: |
          docker run -d --name ci-mongo -p 27017:27017 mongo:7
          for i in {1..30}; do
            docker exec ci-mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            sleep 2
          done
      - name: Run Backend Smoke Check (Ubuntu)
        if: runner.os == 'Linux'
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/sel_ci
        run: node scripts/ci-smoke-backend.cjs
      - name: Run Backend Smoke Check (Windows)
        if: runner.os == 'Windows'
        run: node scripts/ci-smoke-backend.cjs


