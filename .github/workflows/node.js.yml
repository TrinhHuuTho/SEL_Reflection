name: Node.js CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build

  backend_ubuntu:
    name: Backend Smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.runCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      PORT: ${{ vars.PORT || '3000' }}
      MONGO_URI: mongodb://127.0.0.1:27017/sel_ci
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: npm ci
      - name: Run Backend Smoke Check
        run: node scripts/ci-smoke-backend.cjs

  backend_windows:
    name: Backend Smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

    defaults:
      run:
        working-directory: ./backend

    env:
      PORT: ${{ vars.PORT || '3000' }}
      MONGO_URI: ${{ vars.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: npm ci
      - name: Run Backend Smoke Check
        run: node scripts/ci-smoke-backend.cjs

