name: Node.js CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Lint Frontend
        run: npm run lint
      - name: Test Frontend
        run: npx vitest run --passWithNoTests
      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    environment:
      name: ${{ vars.CI_ENVIRONMENT || (github.event_name == 'pull_request' && github.base_ref || github.ref_name) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mongo_uri: mongodb://127.0.0.1:27017/sel_ci
          - os: windows-latest
            mongo_uri: ${{ vars.MONGO_URI }}

    defaults:
      run:
        working-directory: ./backend

    env:
      PORT: ${{ vars.PORT || '3000' }}
      MONGO_URI: ${{ matrix.mongo_uri }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: npm ci
      - name: Start MongoDB for Ubuntu smoke test
        if: runner.os == 'Linux'
        run: |
          docker run -d --name ci-mongo -p 27017:27017 mongo:7
          for i in {1..30}; do
            docker exec ci-mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            sleep 2
          done
      - name: Resolve Windows MONGO_URI
        id: mongo_uri
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          MONGO_URI_SECRET: ${{ secrets.MONGO_URI }}
        run: |
          $resolvedUri = $env:MONGO_URI
          if ([string]::IsNullOrWhiteSpace($resolvedUri)) {
            $resolvedUri = $env:MONGO_URI_SECRET
          }

          if ([string]::IsNullOrWhiteSpace($resolvedUri)) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning "MONGO_URI is empty in both vars and secrets. Windows backend runtime smoke will be skipped."
          }
          else {
            "MONGO_URI=$resolvedUri" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "MONGO_URI resolved. Windows backend runtime smoke will run."
          }
      - name: Run Backend Smoke Check
        if: runner.os == 'Linux' || steps.mongo_uri.outputs.available == 'true'
        run: node scripts/ci-smoke-backend.cjs
      - name: Fallback Backend Syntax Check
        if: runner.os == 'Windows' && steps.mongo_uri.outputs.available != 'true'
        run: node --check src/app.js

  backend_test:
    name: Backend Tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ vars.CI_ENVIRONMENT || (github.event_name == 'pull_request' && github.base_ref || github.ref_name) }}

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.runCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      PORT: ${{ vars.PORT || '3000' }}
      MONGO_URI: mongodb://127.0.0.1:27017/sel_ci_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: npm ci
      - name: Run Backend Tests
        run: npm test -- --coverage
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

